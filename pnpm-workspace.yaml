packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': false
  '@prisma/engines': true
  bcrypt: true
  esbuild: false
  prisma: true
minimumReleaseAgeExclude:
  - '@prisma/config@7.9.0'
  - '@prisma/debug@7.9.0'
  - '@prisma/engines@7.9.0'
  - '@prisma/fetch-engine@7.9.0'
  - '@prisma/get-platform@7.9.0'
  - prisma@7.9.0
